
syntax = "proto3";

import "pl/nowinkitransferowe/data/dark_theme_config.proto";

option java_package = "pl.nowinkitransferowe.core.datastoreproto";
option java_multiple_files = true;

message UserPreferences {
    reserved 2;
    int32 transferResourcesChangeListVersion = 1;
    int32 newsResourceChangeListVersion = 3;

    // Each map is used to store a set of string IDs. The bool has no meaning, but proto3 doesn't
    // have a Set type so this is the closest we can get to a Set.
    map<string, bool> followed_topic_ids = 4;
    map<string, bool> followed_author_ids = 5;
    // API v2 bookmarks and read marks with string ids, unused since 4.0 (see 33-36).
    map<string, bool> bookmarked_news_resource_ids = 6;
    map<string, bool> viewed_news_resource_ids = 7;

    DarkThemeConfigProto dark_theme_config = 8;

    bool use_dynamic_color = 19;

    map<string, bool> bookmarked_transfer_resource_ids = 10;
    map<string, bool> viewed_transfer_resource_ids = 11;

    // Version 3.x notification switches. notifyGeneral also covers the API v3 notifications
    // sent by the editors.
    bool notifyNews = 12;
    bool notifyTransfers = 13;
    bool notifyGeneral = 14;

    // The last applied version of each API v3 change list. 0 means nothing synced yet.
    int32 article_change_list_version = 22;
    int32 transfer_change_list_version = 23;
    int32 rumour_change_list_version = 24;
    int32 club_change_list_version = 25;
    int32 player_change_list_version = 26;

    // Clubs and players the user follows, by API v3 id. Leagues use followed_topic_ids (topic
    // slugs such as "premier-league").
    map<int32, bool> followed_club_ids = 27;
    map<int32, bool> followed_player_ids = 28;

    // Notifications about followed clubs and players, and important news from followed leagues.
    bool notify_followed = 29;
    bool notify_followed_leagues = 30;

    // Keys of the records the user was already notified about, oldest first. A record is notified
    // again only when its key changes, for example when a rumour moves to the next stage.
    repeated string notified_keys = 31;

    // The version of these preferences, used by UserPreferencesMigration.
    int32 schema_version = 32;

    // Saved and read articles and transfers, by API v3 id. 4.0 starts them empty instead of
    // copying the API v2 string ids above.
    map<int32, bool> bookmarked_article_ids = 33;
    map<int32, bool> viewed_article_ids = 34;
    map<int32, bool> bookmarked_transfer_ids = 35;
    map<int32, bool> viewed_transfer_ids = 36;

    // NEXT AVAILABLE ID: 37
}
